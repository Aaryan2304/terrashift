# Man-Made Change Detection — full configuration
# Every parameter used by preprocessing, training, evaluation and quantisation.
# Override on the command line or with a variant file.

experiment:
  name: "baseline"
  seed: 42
  device: "cuda"
  num_workers: 2
  pin_memory: true
  output_root: "./outputs"

data:
  safe_dir: "/home/aaryan/projects/skyserve"
  manifest: "./configs/data_manifest.yaml"
  base_resolution: 10
  patch_size: 256
  stride: 128
  bands: ["B02", "B03", "B04", "B08"]          # native 10 m bands
  extra_bands_20m: ["B11"]                      # used only for NDBI at 20 m
  quantification_value: 10000
  radio_add_offset: -1000
  nodata_value: 0
  pairs:
    A: {tile: "T43QBB", date1: "2022-12-23", date2: "2023-05-12"}
    B: {tile: "T43RGM", date1: "2023-10-06", date2: "2026-10-22"}

preprocess:
  register: true
  register_windows: 5
  register_window_size: 2000
  # The audit showed histogram matching gives the lowest change score on
  # held-out stable land for both pairs. Global fit is rejected: it raises
  # the change score.
  normalize: "histogram"         # none | global | pif | histogram
  resampling: "bilinear"         # for reflectance; nearest for masks
  water_mask: "separate"         # separate stable / dynamic / invalid
  indices:
    ndvi: {formula: "(B08-B04)/(B08+B04)", grid: 10}
    ndwi: {formula: "(B03-B08)/(B03+B08)", grid: 10}
    ndbi: {formula: "(B11-B08)/(B11+B08)", grid: 20}
  thresholds:                     # experimental, not universal constants
    # NDWI > 0.0 is the physical McFeeters boundary and is the most stable
    # across dates (62.3% vs 60.7% for Pair A). NDWI > 0.2 is not stable
    # (61.1% vs 32.3%).
    water_ndwi: 0.0
    water_nir_max: 0.15
    builtup_ndbi: 0.02
    builtup_ndvi_max: 0.30
    change_probability: 0.5

model:
  type: "siamese_unet"            # FC-Siam-diff-inspired
  encoder: "resnet18"
  base_filters: 64
  pretrained: true
  classes: 2                      # unchanged, candidate_change
  validity_mask: true             # separate mask, not a class

training:
  epochs: 100
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  scheduler: "cosine"
  amp: true
  gradient_accumulation: 2
  loss: "bce_dice"
  bce_weight: 1.0
  dice_weight: 1.0
  focal_weight: 0.0               # used only in the focal trial
  focal_gamma: 2.0
  log_interval: 10
  val_interval: 5
  save_every: 10

hparam_search:
  enabled: true
  trials:
    - {name: "baseline", lr: 0.0001, loss: "bce_dice"}
    - {name: "lr_5e4", lr: 0.0005, loss: "bce_dice"}
    - {name: "lr_1e3", lr: 0.001, loss: "bce_dice"}
    - {name: "focal", lr: 0.0001, loss: "bce_dice_focal"}
  search_space:
    lr: [0.0001, 0.0005, 0.001]
    loss: ["bce_dice", "bce_dice_focal"]
    patch_size: [256]

evaluation:
  threshold: 0.5
  metrics: ["precision", "recall", "f1", "iou"]
  object_min_area_px: 4
  size_bins: [4, 16, 64, 256]     # small, medium, large object recall
  split_by: "geography"
  area_uncertainty: "boundary_sensitivity"
  length_method: "skeleton_graph"

quantization:
  method: "onnx_static_qdq"
  api: "onnxruntime.quantization.quantize_static"
  quant_format: "QDQ"
  quant_type: "QInt8"
  calibration_batches: 20
  calibration_split: "train"
  providers_to_test: ["CPUExecutionProvider", "CUDAExecutionProvider"]
  initial_route: "cpu_int8"

hardware:
  ground_proxy: "rtx_3050_ti"
  onboard_proxy: "jetson_orin_nano_8gb"
  onboard_proxy_status: "estimate"
  space_target_status: "conceptual"
